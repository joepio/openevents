<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijn Demodam</title>
<style>
:root {
  --bg: #fff; --side: #fff; --ink: #1b1b1b; --muted: #535353; --line: #d6d6d6; --soft: #f3f3f3;
  --link: #01689b; --brand: #154273; --brand-ink: #fff; --accent: #e17000;
  --open-bg: #dcecf7; --open-ink: #0b4a73; --todo-bg: #fde6cc; --todo-ink: #7a3c00; --done-bg: #e5f1e0; --done-ink: #275c1a;
  --bubble: #eef3f8; --mine: #e5f1e0;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141619; --side: #141619; --ink: #ececec; --muted: #a8adb3; --line: #33373c; --soft: #1e2125;
    --link: #6fb6e6; --brand: #2a6aa8; --accent: #ff9a3c;
    --open-bg: #1b3a52; --open-ink: #bfe0f7; --todo-bg: #4a2f12; --todo-ink: #ffd3a3; --done-bg: #24391e; --done-ink: #c6e6b8;
    --bubble: #1e2a36; --mine: #24391e; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.5 "Fira Sans", "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
a { color: var(--link); }
select, button, input, textarea { font: inherit; }
.demo { background: var(--soft); font-size: 14px; text-align: center; padding: 8px 16px; display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
.pill { border-radius: 99px; padding: 0 10px; font-size: 13px; background: var(--line); }
.pill.on { background: var(--done-bg); color: var(--done-ink); }
header { border-bottom: 1px solid var(--line); }
.bar, .page, footer { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
.bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding-top: 20px; padding-bottom: 20px; }
.brand { font-weight: 700; font-size: 28px; margin-right: auto; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 12px; }
.brand .mark { width: 14px; height: 44px; background: var(--brand); display: inline-block; }
.who { display: flex; align-items: center; gap: 8px; }
.who a { color: var(--link); }
.who select { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; background: var(--bg); color: var(--ink); }
.crumbs { font-size: 15px; margin: 20px 0 8px; color: var(--muted); }
.page { display: grid; grid-template-columns: 240px 1fr; gap: 48px; }
nav.side { padding-top: 16px; }
nav.side a { display: flex; align-items: center; gap: 14px; padding: 9px 12px; color: var(--ink); text-decoration: none; border-radius: 4px; }
nav.side a:hover { background: var(--soft); }
nav.side a.on { font-weight: 700; background: var(--soft); }
nav.side svg { width: 22px; height: 22px; flex: none; }
nav.side .n { margin-left: auto; font-size: 13px; font-weight: 700; }
main { min-width: 0; padding-bottom: 24px; }
h1 { font-size: 34px; line-height: 1.2; margin: 16px 0 8px; }
h2 { font-size: 22px; margin: 32px 0 8px; }
.lead { margin: 0 0 16px; }
.tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin: 16px 0 0; }
.tabs a { padding: 10px 16px; text-decoration: none; color: var(--ink); font-weight: 700; border-bottom: 3px solid transparent; }
.tabs a.on { border-color: var(--brand); }
.tabs .n { font-size: 13px; margin-left: 8px; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; gap: 16px; align-items: center; padding: 16px 12px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.row:hover { background: var(--soft); }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 700; }
.row .s { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .d { color: var(--muted); font-size: 14px; white-space: nowrap; }
.row .arrow { font-size: 20px; color: var(--link); }
.badge { font-size: 13px; font-weight: 700; border-radius: 3px; padding: 1px 8px; white-space: nowrap; background: var(--open-bg); color: var(--open-ink); }
.badge.todo { background: var(--todo-bg); color: var(--todo-ink); } .badge.ok { background: var(--done-bg); color: var(--done-ink); }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--todo-bg); } to { background: transparent; } }
.btn { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 4px; padding: 9px 16px; cursor: pointer; font-weight: 700; }
.btn.light { background: transparent; color: var(--link); border: 2px solid var(--link); }
.btn:disabled { opacity: .5; cursor: default; }
.empty { color: var(--muted); padding: 12px; }
.box { background: var(--soft); padding: 16px; margin: 16px 0; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 24px; margin: 16px 0; }
dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
.timeline { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--line); }
.timeline li { padding: 2px 0 14px 16px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--brand); }
.timeline .when { color: var(--muted); font-size: 14px; }
.chat { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
.msg { max-width: 80%; background: var(--bubble); border-radius: 4px; padding: 10px 14px; }
.msg.me { align-self: flex-end; background: var(--mine); }
.msg .by { font-size: 13px; color: var(--muted); }
form.say { display: flex; gap: 8px; margin-top: 12px; align-items: flex-end; }
form.say textarea { flex: 1; min-height: 48px; border: 1px solid var(--muted); border-radius: 4px; padding: 8px; background: var(--bg); color: var(--ink); }
.how { margin: 32px 0; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
.how code { background: var(--soft); border-radius: 3px; padding: 0 4px; }
.err { color: #d52b1e; }
@media (max-width: 800px) {
  .page { grid-template-columns: 1fr; gap: 0; }
  nav.side { display: flex; overflow-x: auto; gap: 4px; padding-top: 8px; border-bottom: 1px solid var(--line); }
  nav.side a { white-space: nowrap; padding: 8px 10px; }
  nav.side .n { margin-left: 4px; }
  .brand { font-size: 22px; } .brand .mark { height: 34px; }
  h1 { font-size: 26px; }
  .row .d { display: none; }
}
</style>
</head>
<body>
<div class="demo"><span><b>Demo op OpenEvents.</b> Deze pagina leest alleen de eventstroom. De getoonde gegevens zijn fictief.</span><span id="live" class="pill">verbinden…</span></div>
<header><div class="bar">
  <a class="brand" href="#/"><span class="mark"></span>Mijn Demodam</a>
  <div class="who"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span id="me"></span><select id="who" aria-label="Bekijk als" hidden></select><a href="#" id="login" hidden>Inloggen</a><a href="#" id="logout" hidden>Uitloggen</a></div>
</div></header>
<div class="page">
  <nav class="side" id="nav"></nav>
  <main><div class="crumbs" id="crumbs"></div><div id="view"><p class="empty">Laden…</p></div></main>
</div>
<footer><div class="how" id="how"></div></footer>

<script id="app">
// Mijn Demodam: een inwonerportaal dat alleen events kent.
// Lezen: één query naar wat van mij is (de mine-regels in de profielen), daarna één
// stroom (GET /events) vanaf dat punt. Een event past de stand van een resource aan.
// Doen: een handeling posten (POST /events); het resultaat komt terug via de stroom.

const S = { token: "", me: "", claims: {}, res: new Map(), log: new Map(), logged: new Set(), titles: {}, requests: 0, acts: 0, history: 0, events: 0, stream: null, flash: new Set() };
const store = (k, v) => { try { v === undefined ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, JSON.stringify(v)); } catch {} };
const stored = (k) => { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } };

async function api(path, opts = {}) {
  S.requests++;
  await fresh();
  const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", authorization: "Bearer " + S.token, ...(opts.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || body.title || "HTTP " + res.status);
  return body;
}

// RFC 7396: null haalt weg, objecten worden samengevoegd, de rest vervangen.
function merge(a, p) {
  if (!p || typeof p !== "object" || Array.isArray(p)) return p;
  const out = a && typeof a === "object" && !Array.isArray(a) ? { ...a } : {};
  for (const [k, v] of Object.entries(p)) v === null ? delete out[k] : (out[k] = merge(out[k], v));
  return out;
}

// Een resource uit de query: de stand en het event waar die bij hoort.
function put(r) {
  const { _meta: m, ...state } = r;
  S.res.set(m.subject, { id: m.subject, type: m.type, state, updated: m.updated, seq: +m.sequence });
}

// Eén event toepassen: zo verandert de stand, zonder logica per soort.
function apply(e) {
  S.events++;
  if (!e.data) return;
  const d = e.data, id = d.resourceId || e.subject, cur = S.res.get(id), seq = +e.sequence;
  if (cur && seq <= cur.seq) return; // zat al in de query
  if (!cur && !e.mine) return; // niet van mij (het register zegt het, met de mine-regel)
  if (S.logged.has(id)) (S.log.get(id) || S.log.set(id, []).get(id)).push(e);
  S.flash.add(id);
  if (d.deleted) return S.res.delete(id);
  if (d.resourceData) return S.res.set(id, { id, type: d.type || cur?.type, state: d.resourceData, updated: e.time, seq });
  if (d.patch && cur) return S.res.set(id, { ...cur, state: merge(cur.state, d.patch), updated: e.time, seq });
  // Nieuw voor mij, maar alleen een wijziging (bijvoorbeeld: ik ben toegevoegd). Haal de stand op.
  if (d.patch) api("/subjects/" + encodeURIComponent(id)).then((r) => { put(r); render(); }).catch(() => {});
}

async function connect(after = 0) {
  if (S.stream) S.stream.close();
  setLive(false);
  const { ticket } = await api("/events/tickets", { method: "POST" });
  S.requests++;
  const es = new EventSource(`/events?ticket=${encodeURIComponent(ticket)}&after=${after}`);
  S.stream = es;
  let last = after;
  es.onopen = () => setLive(true);
  es.onmessage = (m) => { const e = JSON.parse(m.data); last = +e.sequence || last; apply(e); render(); };
  // Een ticket werkt één keer: bij een storing een nieuw ticket, verder vanaf het laatste event.
  es.onerror = () => { es.close(); setLive(false); setTimeout(() => S.stream === es && connect(last), 3000); };
}

// Een handeling doen. De UI verandert pas als het event terugkomt op de stroom.
async function act(type, subject, data) {
  S.acts++;
  return api("/events", { method: "POST", body: JSON.stringify({ specversion: "1.0", id: crypto.randomUUID(), source: "https://mijn.demodam.nl", type, subject, data }) });
}
const newId = () => "urn:uuid:" + crypto.randomUUID();

// ---------- wat is van mij, en wat is het ----------
const kind = (r) => (r.type || "").split(".").pop();
const ZAAK = ["aanvraag", "melding", "zaak"];
const DONE = ["besloten", "ingetrokken", "afgehandeld", "afgerond", "vervallen"];
const mine = () => true; // de app laadt alleen wat van mij is
const done = (r) => DONE.includes(r.state.status) || !!r.state.momentEindeGesprek || !!r.state.einddatum;
const all = (k) => [...S.res.values()].filter((r) => kind(r) === k);
const newest = (a, b) => (b.updated || "").localeCompare(a.updated || "");
function title(r) {
  const s = r.state;
  if (kind(r) === "melding") return "Melding " + (s.subcategorie || s.categorie || "").toLowerCase();
  return s.titel || s.gespreksonderwerp || s.omschrijving?.replace(/\.$/, "") || s.zaaknummer || r.id;
}
function status(r) {
  const s = r.state;
  if (kind(r) === "gesprek") return s.momentEindeGesprek ? "afgesloten" : "open";
  if (s.einddatum) return "afgerond";
  return s.statusOmschrijving || (/^https?:/.test(s.status || "") ? "" : s.status || "");
}
const zaakOf = (r) => r.state.zaak || r.state.aanleidingZaak || r.state.melding || r.state.aanvraag;
const day = (t) => t ? new Date(t).toLocaleDateString("nl-NL", { day: "numeric", month: "short", year: "numeric" }) : "";
const date = (t) => t ? new Date(t).toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" }) : "";
const time = (t) => t ? new Date(t).toLocaleString("nl-NL", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
const name = (id) => (/^urn:/.test(id || "") && "de gemeente") || (id === S.me && (S.claims.given_name || S.claims.name)) || (S.personas.find((p) => p.id === id)?.label.split(" (")[0]) || (id || "").split("/").pop().replace(/^./, (c) => c.toUpperCase());

// ---------- weergave ----------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function badge(r) {
  const st = status(r);
  if (!st) return "";
  const cls = done(r) ? "ok" : kind(r) === "taak" ? "todo" : "";
  return `<span class="badge ${cls}">${esc(st)}</span>`;
}
const row = (r, sub) => `<li><a class="row${S.flash.has(r.id) ? " flash" : ""}" href="#/r/${encodeURIComponent(r.id)}"><div class="main"><div class="t">${esc(title(r))}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ""}</div><span class="d">${esc(day(r.updated))}</span>${badge(r)}<span class="arrow" aria-hidden="true">→</span></a></li>`;
const list = (items, f, none = "Niets.") => items.length ? `<ul class="rows">${items.map(f).join("")}</ul>` : `<p class="empty">${none}</p>`;
const lastBijdrage = (g) => all("bijdrage").filter((b) => b.state.gesprek === g.id).sort(newest)[0];
const subTaak = (t) => t.state.deadline ? "Uiterlijk " + date(t.state.deadline) : t.state.toelichting || "";
const subZaak = (z) => [z.state.zaaknummer || z.state.identificatie, z.state.adres].filter(Boolean).join(" · ");
const subGesprek = (g) => lastBijdrage(g)?.state.tekstGespreksBijdrage || "";

// Wat van mij is, per soort; ook de tellers in het menu.
function mijn() {
  const open = (l) => l.filter((r) => !done(r)).sort(newest), closed = (l) => l.filter(done).sort(newest);
  const taken = all("taak").filter(mine), zaken = ZAAK.flatMap(all).filter(mine), gesprekken = all("gesprek").filter(mine);
  return { taken: open(taken), takenKlaar: closed(taken), zaken: open(zaken), zakenKlaar: closed(zaken), gesprekken: open(gesprekken), gesprekkenKlaar: closed(gesprekken) };
}

const ICON = {
  "": '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
  taken: '<path d="M3 6l2 2 3-3M3 13l2 2 3-3M11 7h10M11 14h10M3 20h18"/>',
  berichten: '<rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 6l9 7 9-7"/>',
  zaken: '<path d="M3 6h7l2 2h9v11H3z"/>',
};
const PAGES = [["", "Overzicht"], ["taken", "Taken"], ["berichten", "Berichten"], ["zaken", "Zaken"]];

function nav(page, m) {
  const n = { taken: m.taken.length, berichten: m.gesprekken.length, zaken: m.zaken.length };
  return PAGES.map(([k, label]) => `<a href="#/${k}"${page === k ? ' class="on" aria-current="page"' : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${ICON[k]}</svg>${label}${n[k] ? `<span class="n">${n[k]}</span>` : ""}</a>`).join("");
}

function page(k, m) {
  if (k === "taken") return `<h1>Mijn taken</h1><p class="lead">Wat de gemeente van u vraagt.</p>${list(m.taken, (t) => row(t, subTaak(t)), "U hoeft nu niets te doen.")}
    <h2>Afgerond</h2>${list(m.takenKlaar, (t) => row(t, subTaak(t)))}`;
  if (k === "berichten") return `<h1>Mijn berichten</h1><p class="lead">Uw gesprekken met de gemeente. Een vraag stelt u bij de zaak waar die over gaat.</p>${list(m.gesprekken, (g) => row(g, subGesprek(g)), "Geen open gesprekken.")}
    <h2>Gesloten</h2>${list(m.gesprekkenKlaar, (g) => row(g, subGesprek(g)))}`;
  if (k === "zaken" || k === "zaken/gesloten") {
    const dicht = k === "zaken/gesloten";
    return `<h1>Mijn zaken</h1><p class="lead">Volg de status en geschiedenis van uw aanvragen en meldingen.</p>
    <div class="tabs"><a href="#/zaken"${dicht ? "" : ' class="on"'}>Lopende zaken<span class="n">${m.zaken.length}</span></a><a href="#/zaken/gesloten"${dicht ? ' class="on"' : ""}>Gesloten<span class="n">${m.zakenKlaar.length}</span></a></div>
    ${list(dicht ? m.zakenKlaar : m.zaken, (z) => row(z, subZaak(z)), dicht ? "Geen gesloten zaken." : "Geen lopende zaken.")}`;
  }
  return `<h1>Welkom, ${esc(name(S.me))}</h1><p class="lead">Hier ziet u wat u bij de gemeente Demodam heeft lopen.</p>
    <h2>Te doen</h2>${list(m.taken, (t) => row(t, subTaak(t)), "U hoeft nu niets te doen.")}
    <h2>Lopende zaken</h2>${list(m.zaken.slice(0, 5), (z) => row(z, subZaak(z)), "Geen lopende zaken.")}${m.zaken.length > 5 ? `<p><a href="#/zaken">Alle ${m.zaken.length} lopende zaken</a></p>` : ""}
    <h2>Berichten</h2>${list(m.gesprekken, (g) => row(g, subGesprek(g)), "Geen open gesprekken.")}`;
}

// De geschiedenis van een resource komt pas als je hem opent: één verzoek per resource.
function timeline(ids) {
  const todo = ids.filter((id) => !S.logged.has(id));
  if (todo.length) {
    todo.forEach((id) => S.logged.add(id));
    S.history += todo.length;
    Promise.all(todo.map((id) => api(`/subjects/${encodeURIComponent(id)}/events?limit=100`).then(({ events }) => {
      const live = S.log.get(id) || [], known = new Set(events.map((e) => e.id));
      S.log.set(id, [...events, ...live.filter((e) => !known.has(e.id))]);
    }).catch(() => {}))).then(render);
  }
  const events = ids.flatMap((id) => S.log.get(id) || []).sort((a, b) => (a.time || "").localeCompare(b.time || "") || +a.sequence - +b.sequence);
  const what = (e) => (S.titles[e.type] || e.type.split(".").slice(-2).join(" ")) + (e.data?.resourceData?.statustypeOmschrijving ? ": " + e.data.resourceData.statustypeOmschrijving : "");
  return `<ul class="timeline">${events.map((e) => `<li><div class="when">${time(e.time)}</div>${esc(what(e))} <span class="when">door ${esc(name(e.actor))}</span></li>`).join("")}</ul>`;
}

function chat(g) {
  const msgs = all("bijdrage").filter((b) => b.state.gesprek === g.id).sort((a, b) => (a.state.leveringsmoment || "").localeCompare(b.state.leveringsmoment || ""));
  const isOpen = !g.state.momentEindeGesprek;
  return `<div class="chat">${msgs.map((b) => `<div class="msg${b.state.verzender === S.me ? " me" : ""}${S.flash.has(b.id) ? " flash" : ""}"><div class="by">${esc(name(b.state.verzender))}${b.state.automatisch ? " · automatisch" : ""} · ${time(b.state.leveringsmoment)}</div>${esc(b.state.tekstGespreksBijdrage)}</div>`).join("") || `<p class="empty">Nog geen berichten.</p>`}</div>
    ${isOpen ? `<form class="say" data-act="reply" data-id="${esc(g.id)}"><textarea name="tekst" placeholder="Typ uw bericht" required></textarea><button class="btn">Versturen</button></form>
      <p><button class="btn light" data-act="close" data-id="${esc(g.id)}">Vraag beantwoord, gesprek sluiten</button></p>` : `<p class="empty">Dit gesprek is gesloten${g.state.afsluitreden ? ": " + esc(g.state.afsluitreden) : ""}.</p>`}`;
}

function detail(id) {
  const r = S.res.get(id);
  if (!r) return `<p class="empty">Niet gevonden, of (nog) niet zichtbaar voor u.</p>`;
  const k = kind(r), s = r.state;
  const facts = [["Zaaknummer", s.zaaknummer || s.identificatie], ["Status", status(r)], ["Adres", s.adres], ["Ingediend", date(s.ingediend || s.gemeld || s.aanvangsmomentGesprek || s.aangemaakt || s.registratiedatum || s.startdatum)],
    ["Uiterlijke beslisdatum", date(s.uiterlijkeBeslisdatum)], ["Deadline", date(s.deadline)], ["Toelichting", s.toelichting || s.omschrijving], ["Besluit", s.besluit?.uitkomst || s.besluit]]
    .filter(([, v]) => v && typeof v !== "object");
  const parent = zaakOf(r) && S.res.get(zaakOf(r));
  let body = `<h1>${esc(title(r))}</h1><p>${badge(r)}</p>`;
  if (parent) body += `<h2>Hoort bij</h2>${list([parent], (z) => row(z, subZaak(z)))}`;
  body += `<dl>${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
  if (k === "taak" && !done(r)) body += `<div class="box"><p>Klaar met deze taak? Laat het de gemeente weten.</p><button class="btn" data-act="done" data-id="${esc(id)}">Taak afronden</button></div>`;
  if (k === "gesprek") body += chat(r);
  if (ZAAK.includes(k)) {
    const children = [...S.res.values()].filter((x) => zaakOf(x) === id);
    const taken = children.filter((x) => kind(x) === "taak"), gesprekken = children.filter((x) => kind(x) === "gesprek");
    body += `<h2>Taken</h2>${list(taken, (t) => row(t, subTaak(t)))}
      <h2>Berichten</h2>${list(gesprekken, (g) => row(g, subGesprek(g)))}
      ${done(r) ? "" : `<div class="box"><b>Een vraag over deze zaak?</b><form class="say" data-act="ask" data-id="${esc(id)}"><textarea name="tekst" aria-label="Uw vraag" required></textarea><button class="btn">Vraag stellen</button></form></div>`}
      <h2>Wat er gebeurde</h2>${timeline([id, ...children.filter((x) => !["taak", "gesprek"].includes(kind(x))).map((x) => x.id)])}`;
  } else body += `<h2>Wat er gebeurde</h2>${timeline([id])}`;
  return body;
}

let pending = false;
function render() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => {
    pending = false;
    const v = document.getElementById("view");
    if (v.querySelector("textarea:focus")?.value) return; // niet verversen terwijl iemand typt
    const m = mijn(), h = location.hash.replace(/^#\/?/, "");
    let k = h, crumb = "";
    if (h.startsWith("r/")) {
      const r = S.res.get(decodeURIComponent(h.slice(2)));
      k = !r ? "" : kind(r) === "taak" ? "taken" : kind(r) === "gesprek" ? "berichten" : "zaken";
      v.innerHTML = detail(decodeURIComponent(h.slice(2)));
      crumb = r ? " › " + esc(title(r)) : "";
    } else v.innerHTML = page(h, m);
    const sec = PAGES.find(([p]) => p === k.split("/")[0]);
    document.getElementById("crumbs").innerHTML = `<a href="#/">Home</a>${sec && sec[0] ? ` › ${crumb ? `<a href="#/${sec[0]}">${sec[1]}</a>` : sec[1]}` : ""}${crumb}`;
    document.getElementById("nav").innerHTML = nav(k.split("/")[0], m);
    S.flash.clear();
    const lines = document.getElementById("app").textContent.trim().split("\n").length;
    const acts = S.acts ? ` Daarna ${S.acts} keer iets gedaan: elke handeling is één <code>POST /events</code>.` : " Iets doen is één <code>POST /events</code> met een handeling.";
    const hist = S.history ? ` Voor de geschiedenis van wat u opende: ${S.history} verzoek${S.history > 1 ? "en" : ""}.` : "";
    document.getElementById("how").innerHTML = `Deze pagina kent geen API per soort. Laden kostte <b>${S.load}</b> verzoeken: wie u bent, de profielen, <b>één query</b> naar wat van u is (${S.loaded} resources), een ticket en <b>één stroom</b> (<code>GET /events</code>) vanaf dat punt, die live blijft (${S.events} events).${acts}${hist} Wat van u is, wat u mag zien en wat u mag doen staat in de profielen en geldt in het register. De app is ${lines} regels JavaScript, zonder build. <a href="/ui">Techniek</a>`;
  });
}
const setLive = (on) => { const l = document.getElementById("live"); l.textContent = on ? "live" : "verbinden…"; l.className = "pill" + (on ? " on" : ""); };

// ---------- knoppen ----------
document.addEventListener("submit", async (ev) => {
  const f = ev.target; ev.preventDefault();
  const tekst = f.tekst.value.trim(), id = f.dataset.id;
  if (!tekst) return;
  f.querySelector("button").disabled = true;
  try {
    if (f.dataset.act === "reply") await act("nl.vng.gesprekken.bijdrage.toegevoegd", newId(), { resourceData: { gesprek: id, tekstGespreksBijdrage: tekst } });
    if (f.dataset.act === "ask") {
      const z = S.res.get(id), g = newId();
      await act("nl.vng.gesprekken.gesprek.gestart", g, { commits: [
        { resourceId: g, type: "nl.vng.gesprekken.gesprek", resourceData: { gespreksonderwerp: "Vraag over " + (z.state.zaaknummer || title(z)), aanleidingZaak: id, team: z.state.team,
          gespreksdeelnames: [{ type: "partij", partij: S.me, naam: name(S.me) }] } },
        { resourceId: newId(), type: "nl.vng.gesprekken.bijdrage", resourceData: { gesprek: g, tekstGespreksBijdrage: tekst } }] });
      location.hash = "#/r/" + encodeURIComponent(g);
    }
    f.tekst.value = "";
  } catch (e) { f.insertAdjacentHTML("afterend", `<p class="err">${esc(e.message)}</p>`); }
  f.querySelector("button").disabled = false;
  render();
});
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-act]");
  if (!b || b.form) return;
  b.disabled = true;
  try {
    if (b.dataset.act === "done") await act("nl.vng.taken.taak.afgerond", b.dataset.id, { patch: {} });
    if (b.dataset.act === "close") await act("nl.vng.gesprekken.gesprek.afgesloten", b.dataset.id, { patch: { afsluitreden: "Vraag beantwoord" } });
  } catch (e) { b.insertAdjacentHTML("afterend", ` <span class="err">${esc(e.message)}</span>`); b.disabled = false; }
});
addEventListener("hashchange", render);

// ---------- inloggen ----------
// Echt: OpenID Connect met PKCE bij de IdP uit /ui/config (publieke client, geen geheim).
// Demo: met dev-modus aan een persona uit de profielen ("bekijk als").
const back = () => location.origin + location.pathname;
const b64 = (a) => btoa(String.fromCharCode(...a)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const discover = (cfg) => fetch(cfg.issuer.replace(/\/$/, "") + "/.well-known/openid-configuration").then((r) => r.json());
async function loginStart() {
  const conf = await discover(S.cfg.login);
  const verifier = b64(crypto.getRandomValues(new Uint8Array(32))), state = b64(crypto.getRandomValues(new Uint8Array(16)));
  const challenge = b64(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier))));
  store("mijn-demodam-pkce", { verifier, state, hash: location.hash });
  location.href = conf.authorization_endpoint + "?" + new URLSearchParams({ client_id: S.cfg.login.clientId, response_type: "code", scope: "openid",
    redirect_uri: back(), code_challenge: challenge, code_challenge_method: "S256", state });
}
async function tokens(body) {
  const conf = await discover(S.cfg.login);
  const r = await fetch(conf.token_endpoint, { method: "POST", body: new URLSearchParams({ client_id: S.cfg.login.clientId, ...body }) });
  if (!r.ok) throw new Error("Inloggen mislukt");
  const t = await r.json();
  const o = { access: t.access_token, refresh: t.refresh_token, exp: Date.now() + t.expires_in * 1000, logout: conf.end_session_endpoint, id: t.id_token };
  store("mijn-demodam-oidc", o);
  S.token = o.access;
  return o;
}
// Een verlopen token stil vernieuwen voor een verzoek.
async function fresh() {
  const o = stored("mijn-demodam-oidc");
  if (o && S.token === o.access && Date.now() > o.exp - 30000) await tokens({ grant_type: "refresh_token", refresh_token: o.refresh }).catch(() => logout());
}
function logout() {
  const o = stored("mijn-demodam-oidc");
  store("mijn-demodam-oidc");
  location.href = o?.logout ? o.logout + "?" + new URLSearchParams({ client_id: S.cfg.login.clientId, post_logout_redirect_uri: back(), ...(o.id ? { id_token_hint: o.id } : {}) }) : back();
}

async function start(token) {
  if (S.stream) S.stream.close();
  S.token = token;
  S.res.clear(); S.log.clear(); S.logged.clear(); S.requests = 0; S.acts = 0; S.history = 0; S.events = 0; S.loaded = 0;
  const [me, { profiles }] = await Promise.all([api("/me"), api("/profiles")]);
  S.me = me.id; S.claims = me.claims || {};
  document.getElementById("me").textContent = stored("mijn-demodam-oidc") ? name(S.me) : "";
  for (const p of profiles) Object.assign(S.titles, p.titles || {});
  // Wat van mij is, over alle soorten. Daarna de stroom vanaf het punt van de query.
  let cursor = null, feed = null;
  do {
    const page = await api("/query", { method: "POST", body: JSON.stringify({ mine: true, pageSize: 100, cursor }) });
    page.results.forEach(put);
    S.loaded += page.results.length;
    feed ??= page.feedCursor;
    cursor = page.next;
  } while (cursor);
  await connect(feed);
  S.load = S.requests;
  render();
}

(async () => {
  S.cfg = await fetch("/ui/config").then((r) => r.json());
  S.personas = S.cfg.personas || [];
  const sel = document.getElementById("who"), inBtn = document.getElementById("login"), outBtn = document.getElementById("logout");
  inBtn.onclick = (e) => { e.preventDefault(); loginStart(); };
  outBtn.onclick = (e) => { e.preventDefault(); logout(); };
  const q = new URLSearchParams(location.search), pkce = stored("mijn-demodam-pkce");
  try {
    if (q.get("code") && pkce && q.get("state") === pkce.state) {
      store("mijn-demodam-pkce");
      await tokens({ grant_type: "authorization_code", code: q.get("code"), redirect_uri: back(), code_verifier: pkce.verifier });
      history.replaceState(null, "", back() + (pkce.hash || ""));
    }
    const o = stored("mijn-demodam-oidc");
    if (o) { outBtn.hidden = false; return await start(o.access); }
  } catch (e) { store("mijn-demodam-oidc"); }
  inBtn.hidden = !S.cfg.login;
  const inwoners = S.personas.filter((p) => ["inwoner", "curator"].includes(p.claims?.rol));
  if (!S.cfg.devAuth || !inwoners.length) {
    document.getElementById("view").innerHTML = S.cfg.login ? `<h1>Mijn Demodam</h1><p>Log in om te zien wat u bij de gemeente heeft lopen.</p><p><button class="btn" onclick="loginStart()">Inloggen</button></p>` : `<p class="empty">Geen inlog ingesteld en geen dev-modus.</p>`;
    return;
  }
  // Demo: bekijk als een inwoner uit de profielen.
  sel.hidden = false;
  sel.innerHTML = inwoners.map((p) => `<option value="${esc(p.id)}">${esc(p.label)}</option>`).join("");
  let saved; try { saved = localStorage.getItem("mijn-demodam-wie"); } catch {}
  sel.value = inwoners.some((p) => p.id === saved) ? saved : (inwoners.find((p) => p.id.endsWith("/jan")) || inwoners[0]).id;
  const as = () => {
    const p = inwoners.find((x) => x.id === sel.value);
    try { localStorage.setItem("mijn-demodam-wie", p.id); } catch {}
    start("dev:" + p.id + Object.entries(p.claims || {}).map(([k, v]) => `|${k}=${v}`).join(""));
  };
  sel.onchange = as;
  as();
})();
</script>
